name: Daily push notification

on:
  push:
    branches: [main]
    paths: [data.json]
  workflow_dispatch:
    inputs:
      test:
        description: "テスト通知として送る"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock web-push@3.6.7
      - run: node .github/scripts/notify.mjs
        env:
          VAPID_PUBLIC_KEY: BF0cPqf6PRHY9GrW_2otpsHdZPE7aPhMCBnK6Ves8gnNmwR6EdRDtyMzuIlNFdPSEG5ETyPacyxsPqus3-P1bFY
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          TEST: ${{ inputs.test }}

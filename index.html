<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>首都圏アート暦</title>
<meta name="description" content="東京・神奈川・千葉・埼玉の展覧会を毎朝まとめる個人用ダッシュボード">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="アート暦">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E9E9EB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0C0E" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Inter:wght@300;400;500;600&display=swap">
<style>
/* Soft-grey ground, big white rounded tiles, black active pills, peach accent, thin "barcode" charts. 12-col grid on iPad landscape, single column on phone. */
:root{
  --bg:#E9E9EB; --tile:#F6F6F7; --white:#FFFFFF; --ink:#111113; --muted:#6B6B72; --faint:#A3A3AA; --line:#DEDEE2;
  --peach:#F0BE8E; --peach-soft:#FBE4CF; --peach-ink:#9A4F12; --green-soft:#D6F3CF; --green-ink:#2F6B22; --blue-soft:#E1E6FA; --blue-ink:#3346A8;
  --sea:#D9E1EA; --land:#FFFFFF; --land-ctx:#EFEFF1; --border:#C9CDD6;
  --g-con:#3346A8; --g-pho:#5A6170; --g-jpn:#9A6B1E; --g-wst:#7448B8; --g-des:#3F7D20; --g-tec:#0E7C9A; --g-ill:#B5543A; --g-pop:#C2366B; --g-oth:#8A8F9C; --g-mus:#1F7A5A;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-num:"Inter",system-ui,sans-serif;
  --r:26px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C0C0E; --tile:#18181B; --white:#222226; --ink:#F2F2F4; --muted:#A1A1A9; --faint:#66666E; --line:#2C2C31;
  --peach:#E2A673; --peach-soft:#3B2617; --peach-ink:#F5BE8C; --green-soft:#1E3319; --green-ink:#9AD98A; --blue-soft:#1D2347; --blue-ink:#A9B5FF;
  --sea:#10151C; --land:#26262B; --land-ctx:#1C1C20; --border:#3A3A42;
  --g-con:#8F9CFF; --g-pho:#A0AEC0; --g-jpn:#E0B060; --g-wst:#B79BF0; --g-des:#8FD16A; --g-tec:#4CC3DD; --g-ill:#F2937A; --g-pop:#F27FA8; --g-oth:#7D8493; --g-mus:#5FD3A8;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C0C0E; --tile:#18181B; --white:#222226; --ink:#F2F2F4; --muted:#A1A1A9; --faint:#66666E; --line:#2C2C31;
  --peach:#E2A673; --peach-soft:#3B2617; --peach-ink:#F5BE8C; --green-soft:#1E3319; --green-ink:#9AD98A; --blue-soft:#1D2347; --blue-ink:#A9B5FF;
  --sea:#10151C; --land:#26262B; --land-ctx:#1C1C20; --border:#3A3A42;
  --g-con:#8F9CFF; --g-pho:#A0AEC0; --g-jpn:#E0B060; --g-wst:#B79BF0; --g-des:#8FD16A; --g-tec:#4CC3DD; --g-ill:#F2937A; --g-pop:#F27FA8; --g-oth:#7D8493; --g-mus:#5FD3A8;
  color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6;-webkit-text-size-adjust:100%;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
a{color:inherit}
button,select,input{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:300;letter-spacing:-.02em}
.wrap{max-width:1280px;margin:0 auto;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* ---------- top bar ---------- */
.top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;white-space:nowrap}
.logo{width:42px;height:42px;border-radius:50%;background:var(--white);display:grid;place-items:center}
.logo svg{width:20px;height:20px}
.nav{display:flex;gap:6px;justify-content:center;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;text-decoration:none;padding:0 18px;height:42px;display:inline-flex;align-items:center;border-radius:999px;background:var(--tile);font-size:13px;color:var(--ink)}
.nav a[aria-current="true"]{background:var(--ink);color:var(--bg)}
.icons{display:flex;gap:8px}
.ic{width:42px;height:42px;border-radius:50%;border:0;background:var(--tile);display:grid;place-items:center;cursor:pointer}
.ic svg{width:18px;height:18px}
@media (max-width:759px){
  .top{grid-template-columns:minmax(0,1fr) auto}
  .nav{grid-column:1/-1;grid-row:2;justify-content:flex-start;margin:0 -16px;padding:0 16px}
}

/* ---------- grid ---------- */
.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.tile{background:var(--tile);border-radius:var(--r);padding:20px;min-width:0;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-content:start;position:relative}
.tile-h{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:36px}
.tile-h h2{font-size:16px;font-weight:500}
.go{width:38px;height:38px;border-radius:50%;border:0;background:var(--white);display:grid;place-items:center;cursor:pointer;flex:none;text-decoration:none}
.go svg{width:15px;height:15px}
.go.dark{background:var(--ink);color:var(--bg)}
@media (min-width:760px){
  .grid{grid-template-columns:repeat(6,minmax(0,1fr))}
  .hero{grid-column:1/-1}
  .k1,.k2{grid-column:span 3}
  .genre{grid-column:span 6}
  .picks{grid-column:1/-1}
  .list{grid-column:1/-1}
  .area{grid-column:1/-1}
  .talks{grid-column:1/-1}
  .chart{grid-column:1/-1}
}
@media (min-width:1080px){
  .grid{grid-template-columns:repeat(12,minmax(0,1fr))}
  .hero{grid-column:1/-1}
  .kcol{grid-column:span 3;display:grid;gap:14px;grid-template-rows:1fr 1fr;grid-template-columns:minmax(0,1fr);min-width:0}
  .k1,.k2{grid-column:auto}
  .genre{grid-column:span 3}
  .picks{grid-column:span 6}
  .list{grid-column:1/-1}
  .area{grid-column:span 7}
  .talks{grid-column:span 5}
  .chart{grid-column:1/-1}
}
.kcol{display:contents}
@media (min-width:1080px){.kcol{display:grid}}

/* ---------- hero ---------- */
.hero{display:grid;gap:18px;padding:12px 4px 4px;grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.hero{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:end}}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.stat{display:grid;gap:6px;padding:0 0 0 12px;border-left:1px solid var(--faint)}
.stat:first-child{padding-left:12px}
.stat span{font-size:12px;color:var(--muted)}
.stat b{font-size:clamp(34px,6vw,46px);line-height:1}
.stat b small{font-size:15px;color:var(--muted);margin-left:4px;font-family:var(--f-body);letter-spacing:0}
.bars{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin-top:14px;height:18px}
.bars i{display:block;height:18px;border-radius:999px}
.b1{background:var(--ink)}
.b2wrap{position:relative;border-radius:0 999px 999px 0;
  background:repeating-linear-gradient(115deg,transparent 0 5px,var(--line) 5px 6.5px)}
.b2{position:absolute;inset:0 auto 0 0;background:var(--peach)}
.date{display:grid;justify-items:end;text-align:right;gap:2px}
.date .d{font-size:clamp(64px,13vw,120px);line-height:.9;font-weight:200}
.date .w{font-size:13px;color:var(--muted)}
.date .note{font-size:12px;color:var(--muted);max-width:28em}
@media (max-width:759px){.date{justify-items:start;text-align:left;order:-1}}

/* ---------- KPI tiles ---------- */
.kpi .big{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.kpi .v{display:grid;gap:2px}
.kpi .v b{font-size:40px;line-height:1}
.kpi .v span{font-size:12px;color:var(--muted)}
.code{display:flex;min-width:0;overflow:hidden;align-items:flex-end;gap:3px;height:46px}
.code i{display:block;width:2px;border-radius:1px;background:var(--faint);opacity:.5}
.code i.on{background:var(--ink);opacity:1}
.kpi .sub{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;display:grid;grid-template-columns:minmax(0,1fr);gap:4px}
.kpi .sub button span:first-child{min-width:0}
.kpi .sub button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.kpi .sub button span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.kpi .sub button span:last-child{font-family:var(--f-num);flex:none}

/* ---------- genre bars ---------- */
.gbars{display:grid;gap:9px}
.gb{display:grid;gap:3px;cursor:pointer;border:0;background:none;padding:0;text-align:left}
.gb .lbl{font-size:11px;color:var(--muted)}
.gb .track{display:flex;align-items:center;height:22px}
.gb .fill{height:22px;border-radius:999px 0 0 999px;background:var(--white);min-width:6px}
.gb .pill{height:22px;margin-left:-4px;padding:0 10px;border-radius:999px;background:var(--ink);color:var(--bg);font-family:var(--f-num);font-size:11px;display:inline-flex;align-items:center;white-space:nowrap}
.gb[aria-pressed="true"] .fill{background:var(--peach)}
.axis{display:flex;justify-content:space-between;font-family:var(--f-num);font-size:10px;color:var(--faint)}

/* ---------- pick cards ---------- */
.pcards{display:grid;gap:10px;grid-auto-flow:column;grid-auto-columns:minmax(240px,78%);overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -20px;padding:0 20px}
.pcards::-webkit-scrollbar{display:none}
@media (min-width:760px){.pcards{grid-auto-flow:row;grid-template-columns:repeat(3,minmax(0,1fr));overflow:visible;margin:0;padding:0}}
.pc{scroll-snap-align:start;background:var(--white);border-radius:20px;padding:8px;display:grid;gap:10px;align-content:start;cursor:pointer;min-width:0}
.vis{position:relative;border-radius:14px;aspect-ratio:4/3.4;overflow:hidden;padding:12px;display:flex;flex-direction:column;justify-content:space-between}
.vis .kanji{position:absolute;right:-6px;bottom:-22px;font-size:120px;font-weight:700;line-height:1;opacity:.16;color:var(--ink);pointer-events:none}
.vis .acts{display:flex;justify-content:flex-end;gap:6px;position:relative}
.vis .acts .go{width:32px;height:32px;background:var(--white)}
.vis .acts .go.dark{background:var(--ink)}
.vis .chips{display:flex;gap:4px;flex-wrap:wrap;position:relative}
.chip{font-size:10px;padding:2px 8px;border-radius:999px;background:var(--white);white-space:nowrap}
.pc .info{display:grid;gap:2px;padding:0 4px}
.pc .r1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pc h3{font-size:13px;font-weight:700;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc .end{font-family:var(--f-num);font-size:13px;font-weight:500;white-space:nowrap}
.pc .where{font-size:11px;color:var(--muted)}
.pc .why{font-size:11px;color:var(--muted);line-height:1.55;padding:6px 4px 2px;border-top:1px solid var(--line)}
.pc .tags{display:flex;gap:4px;flex-wrap:wrap;padding:0 4px 4px}
.pc .tags span{font-size:10px;border:1px solid var(--line);border-radius:999px;padding:1px 7px;color:var(--muted)}

/* ---------- table ---------- */
.fbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sel{position:relative;display:inline-flex}
.sel select{appearance:none;-webkit-appearance:none;border:0;background:var(--white);border-radius:999px;height:40px;padding:0 34px 0 16px;font-size:13px;cursor:pointer}
.sel::after{content:"";position:absolute;right:15px;top:50%;width:6px;height:6px;margin-top:-5px;border-right:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);transform:rotate(45deg);pointer-events:none}
.search{flex:1 1 180px;display:flex;align-items:center;gap:8px;background:var(--white);border-radius:999px;height:40px;padding:0 14px}
.search svg{width:15px;height:15px;flex:none}
.search input{border:0;background:none;outline:none;width:100%;font-size:16px}
@media (min-width:760px){.search input{font-size:13px}}
.thead,.tr{display:grid;grid-template-columns:minmax(0,2.6fr) minmax(0,1.1fr) minmax(0,1fr) minmax(0,.8fr) minmax(0,1fr) 40px;gap:12px;align-items:center}
.thead{font-size:12px;color:var(--muted);padding:0 4px}
.tr{padding:10px 4px;border-top:1px solid var(--line);cursor:pointer}
.tr:hover{background:var(--white);border-radius:14px}
.pn{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center}
.thumb{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:17px;color:var(--ink)}
.pn b{display:block;font-size:13px;font-weight:700;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn small{display:block;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc.num{font-size:13px}
.st{justify-self:start;font-size:11px;padding:4px 12px;border-radius:999px;white-space:nowrap}
.st.ending{background:var(--peach-soft);color:var(--peach-ink)}
.st.open{background:var(--green-soft);color:var(--green-ink)}
.st.soon{background:var(--blue-soft);color:var(--blue-ink)}
.st.perm,.st.tbd{background:var(--white);color:var(--muted)}
.star{width:36px;height:36px;border-radius:50%;border:0;background:var(--white);cursor:pointer;font-size:15px;color:var(--faint)}
.star[aria-pressed="true"]{color:var(--peach-ink)}
@media (max-width:759px){
  .thead{display:none}
  .tr{grid-template-columns:minmax(0,1fr) auto;row-gap:6px}
  .tr .pn{grid-column:1/-1}
  .tr .c-g,.tr .c-p{display:none}
  .tr .c-d{grid-column:1;padding-left:56px;color:var(--muted)}
  .tr .st{grid-column:2;grid-row:2;justify-self:end}
  .tr .c-a{display:none}
}
.count{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.morebtn{justify-self:center;border:0;background:var(--white);border-radius:999px;height:40px;padding:0 20px;font-size:13px;cursor:pointer}
.empty{padding:22px 10px;text-align:center;color:var(--muted);font-size:13px}

/* ---------- area map ---------- */
.mapbox{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:4/3.3;max-width:100%;background:var(--sea);touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
.mapbox.dragging{cursor:grabbing}
.zoom{position:absolute;right:10px;bottom:10px;display:grid;gap:1px;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgb(0 0 0 / .18);z-index:3}
.zoom button{border:0;background:var(--white);color:var(--ink);width:36px;height:36px;font-size:18px;line-height:1;cursor:pointer;padding:0}
.zoom button:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.route{justify-self:start;display:inline-flex;align-items:center;gap:6px;margin-top:4px;background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 14px;font-size:12px;text-decoration:none}
.mapbox svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.mapbox .ctx{fill:var(--land-ctx);stroke:var(--border);stroke-width:.6}
.mapbox .pf{fill:var(--land);stroke:var(--border);stroke-width:1;cursor:pointer}
.mapbox .pf.on{fill:var(--peach-soft)}
.mapbox .pf.dim{fill:var(--land-ctx)}
.ov{position:absolute;inset:0;pointer-events:none}
.ov>*{pointer-events:auto;position:absolute;transform:translate(-50%,-50%)}
.pchip{border:0;background:var(--ink);color:var(--bg);font-size:11px;border-radius:999px;padding:3px 10px;white-space:nowrap;cursor:pointer}
.pchip b{font-family:var(--f-num);font-weight:500;margin-left:4px}
.pchip[aria-pressed="true"]{background:var(--peach-ink)}
.lm{pointer-events:none!important;font-size:11px;color:var(--muted);white-space:nowrap;letter-spacing:.04em}
.pin{border-radius:50%;border:2px solid var(--white);background:var(--pc,var(--ink));cursor:pointer;padding:0;box-shadow:0 1px 3px rgb(0 0 0 / .25)}
.pin.multi{background:var(--ink)}
.pin[aria-pressed="true"]{outline:3px solid var(--peach);outline-offset:1px;z-index:2}
.pin.off{opacity:.25}
.mapbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mapnote{font-size:11px;color:var(--muted)}
.venue{background:var(--white);border-radius:16px;padding:12px 14px;display:grid;gap:6px}
.venue h3{font-size:13px;font-weight:700}
.venue button{all:unset;cursor:pointer;display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12px;padding:4px 0;border-top:1px solid var(--line)}
.venue button:focus-visible{outline:2px solid var(--ink)}
.venue button i{width:8px;height:8px;border-radius:50%}
.venue button span:last-child{font-family:var(--f-num);color:var(--muted);font-size:11px}
.venue p{font-size:12px;color:var(--muted)}

/* ---------- timeline ---------- */
.tl-box{background:var(--white);border-radius:18px;overflow-x:auto;-webkit-overflow-scrolling:touch;--name:9rem}
@media (min-width:760px){.tl-box{--name:13rem}}
.tl{min-width:640px;padding-bottom:8px}
.tl-head,.tl-row{display:grid;grid-template-columns:var(--name) minmax(0,1fr)}
.tl-head{border-bottom:1px solid var(--line)}
.tl-head .lbl{padding:10px 12px;font-size:11px;color:var(--faint);position:sticky;left:0;background:var(--white);z-index:3}
.months{position:relative;height:34px}
.months span{position:absolute;top:0;bottom:0;padding:10px 0 0 6px;font-family:var(--f-num);font-size:11px;color:var(--muted);border-left:1px solid var(--line);white-space:nowrap}
.tl-row{min-height:38px;cursor:pointer}
.tl-row .nm{position:sticky;left:0;z-index:2;background:var(--white);padding:4px 10px 4px 12px;font-size:12px;line-height:1.35;display:flex;align-items:center;min-width:0}
.tl-row .nm span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.track{position:relative}
.bar{position:absolute;top:50%;height:12px;margin-top:-6px;border-radius:999px;background:var(--gc,var(--ink))}
.bar.ending{box-shadow:0 0 0 2px var(--white),0 0 0 4px var(--peach)}
.bar.soon{background:repeating-linear-gradient(115deg,var(--gc,var(--faint)) 0 3px,transparent 3px 6px);box-shadow:inset 0 0 0 1.5px var(--gc,var(--faint))}
.gdot{flex:none;width:8px;height:8px;border-radius:50%;margin-right:8px;background:var(--gc)}
.legend-g{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin:14px 0 8px}
.legend-g i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.gridline{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.now{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--peach-ink);z-index:1}
.seg{display:inline-flex;background:var(--white);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:999px;padding:0 12px;height:32px;font-size:12px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:8px;border-radius:999px;margin-right:6px;vertical-align:middle}

/* ---------- talks ---------- */
.trow{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;align-items:start}
.trow:first-child{border-top:0}
.dbox{background:var(--white);border-radius:14px;height:52px;display:grid;place-content:center;text-align:center;line-height:1.1}
.dbox b{font-family:var(--f-num);font-weight:400;font-size:18px}
.dbox small{font-size:10px;color:var(--muted)}
.trow .k{font-size:10px;background:var(--ink);color:var(--bg);border-radius:999px;padding:1px 8px;justify-self:start}
.trow .t{font-size:13px;font-weight:700;line-height:1.45}
.trow .m{font-size:11px;color:var(--muted)}
.trow .what{display:grid;gap:3px}
.trow.off{opacity:.5}
.ev .kr,.trow .kr{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ap{font-size:10px;border-radius:999px;padding:1px 8px;white-space:nowrap;justify-self:start}
.ap.free{background:var(--green-soft);color:var(--green-ink)}
.ap.req{background:var(--peach-soft);color:var(--peach-ink)}
.ap.req.hot{background:var(--peach-ink);color:var(--bg)}
.ap.soon{background:var(--blue-soft);color:var(--blue-ink)}
.ap.closed{background:var(--white);color:var(--muted);text-decoration:line-through}
.ap.tbd{background:var(--white);color:var(--muted)}
.t-alert{display:grid;gap:6px}
.t-alert:empty{display:none}
.al-h{font-size:11px;color:var(--muted)}
.al{all:unset;cursor:pointer;display:grid;gap:3px;background:var(--white);border-radius:14px;padding:10px 12px}
.al:focus-visible{outline:2px solid var(--ink)}
.al .t{font-size:13px;font-weight:700;line-height:1.45}
.al .m{font-size:11px;color:var(--muted)}
.tf{display:flex;gap:6px;flex-wrap:wrap}


/* ---------- sheet ---------- */
.scrim[hidden]{display:none}
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:760px){.scrim{align-items:center;padding:24px}}
.sheet{background:var(--tile);width:100%;max-width:600px;border-radius:28px 28px 0 0;max-height:88vh;overflow:auto;overscroll-behavior:contain;
  padding:10px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:grid;gap:16px}
@media (min-width:760px){.sheet{border-radius:28px;padding:24px}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--faint);justify-self:center;opacity:.5}
@media (min-width:760px){.grab{display:none}}
.sheet .vis{aspect-ratio:auto;min-height:150px}
.sheet h3{font-size:20px;font-weight:700;line-height:1.4}
.sheet .one{font-size:13px;color:var(--muted);line-height:1.7}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fact{background:var(--white);border-radius:16px;padding:12px 14px;display:grid;gap:2px;min-width:0}
.fact span{font-size:11px;color:var(--muted)}
.fact b{font-size:13px;font-weight:500;overflow-wrap:anywhere}
.fact.wide{grid-column:1/-1}
.tbd{color:var(--peach-ink)}
.evs{display:grid;gap:8px}
.evs h4{margin:0;font-size:15px;font-weight:500}
.ev{background:var(--white);border-radius:16px;padding:12px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:start}
.ev .dbox{background:var(--tile)}
.ev .what{display:grid;gap:3px}
.ev .k{font-size:10px;background:var(--ink);color:var(--bg);border-radius:999px;padding:1px 8px;justify-self:start}
.ev .t{font-size:13px;font-weight:700}
.ev .m{font-size:11px;color:var(--muted)}
.ev a{font-size:12px;text-decoration:underline}
.ev.past{opacity:.5}
.ev-empty{background:var(--white);border-radius:16px;padding:12px 14px;font-size:12px;color:var(--muted)}
details summary{cursor:pointer;font-size:12px;color:var(--muted);min-height:32px;display:flex;align-items:center}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;background:var(--white);border-radius:999px;padding:0 20px;height:46px;display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;text-decoration:none}
.btn.dark{background:var(--ink);color:var(--bg)}
.nt{display:grid;gap:12px}
.nt h3{font-size:20px;font-weight:700}
.nt p,.nt li{font-size:13px;line-height:1.7;color:var(--muted)}
.nt ol{margin:0;padding-left:20px;display:grid;gap:4px}
.nt b{color:var(--ink);font-weight:700}
.nt .box{background:var(--white);border-radius:16px;padding:12px 14px;display:grid;gap:8px}
.nt textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:12px;background:var(--tile);color:var(--ink);font:12px/1.5 ui-monospace,Menlo,monospace;padding:10px;resize:vertical;word-break:break-all}
.nt .ok{color:var(--green-ink)}
.nt .ng{color:var(--peach-ink)}
.nt a{color:var(--ink)}

footer{font-size:11px;color:var(--muted);display:grid;gap:6px;padding:8px 4px}
footer ul{margin:0;padding-left:16px;display:grid;gap:2px}
footer a{color:var(--muted)}
</style>

<div class="wrap">
  <div class="top">
    <div class="brand"><span class="logo"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 17 9 3h3l-7 14Z" fill="currentColor"/><path d="M11 17l3.5-7L18 17Z" fill="currentColor"/></svg></span>首都圏アート暦</div>
    <nav class="nav" aria-label="セクション">
      <a href="#top" aria-current="true">ダッシュボード</a><a href="#list">展覧会</a><a href="#area">地図</a><a href="#chart">会期</a><a href="#talks">イベント</a>
    </nav>
    <div class="icons">
      <button class="ic" id="btn-search" aria-label="検索"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="9" r="6"/><path d="m14 14 4 4"/></svg></button>
      <button class="ic" id="btn-notify" aria-label="通知の設定"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 14V9a5 5 0 0 1 10 0v5l1.5 2h-13Z"/><path d="M8.5 17.5a1.6 1.6 0 0 0 3 0"/></svg></button>
      <button class="ic" id="btn-theme" aria-label="表示モードを切り替え"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="7"/><path d="M10 3a7 7 0 0 0 0 14Z" fill="currentColor"/></svg></button>
    </div>
  </div>

  <div class="grid" id="top">
    <section class="hero">
      <div class="stats" id="stats"></div>
      <div class="date"><span class="d num" id="today-d"></span><span class="w" id="today-w"></span><span class="note" id="notice"></span></div>
    </section>

    <div class="kcol">
      <section class="tile kpi k1" id="k-closing"></section>
      <section class="tile kpi k2" id="k-opening"></section>
    </div>

    <section class="tile genre">
      <div class="tile-h"><h2>ジャンル別</h2><span class="count" id="g-total"></span></div>
      <div class="gbars" id="gbars"></div>
    </section>

    <section class="tile picks">
      <div class="tile-h"><h2>今週のおすすめ</h2><a class="go" href="#list" aria-label="一覧へ"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12 12 4M6 4h6v6"/></svg></a></div>
      <div class="pcards" id="pcards"></div>
    </section>

    <section class="tile list" id="list">
      <div class="fbar">
        <label class="sel"><select id="f-genre" aria-label="ジャンル"></select></label>
        <label class="sel"><select id="f-area" aria-label="エリア"></select></label>
        <label class="sel"><select id="f-status" aria-label="状態"></select></label>
        <label class="sel"><select id="f-scale" aria-label="会場の規模"></select></label>
        <label class="search"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="9" r="6"/><path d="m14 14 4 4"/></svg><input id="q" type="search" placeholder="展覧会名・会場で検索"></label>
      </div>
      <div class="thead"><span>展覧会</span><span>ジャンル</span><span>会期</span><span>残り</span><span>状態</span><span></span></div>
      <div id="rows"></div>
      <button class="morebtn" id="more" hidden></button><span class="count" id="count"></span>
    </section>

    <section class="tile area" id="area">
      <div class="tile-h"><h2>地図</h2>
        <div class="seg" role="group" aria-label="地図の範囲"><button data-view="kanto">関東</button><button data-view="all">首都圏</button><button data-view="center">都心</button></div>
      </div>
      <div class="mapbox" id="map"><svg id="map-svg" preserveAspectRatio="none" aria-hidden="true"></svg><div class="ov" id="map-ov"></div><div class="zoom"><button data-zoom="in" aria-label="拡大">＋</button><button data-zoom="out" aria-label="縮小">－</button></div></div>
      <div class="mapbar"><span class="mapnote" id="map-note"></span></div>
      <div class="venue" id="venue"><p>ピンをタップすると、その会場の展示が出ます。県名をタップするとその県だけに絞り込みます。</p></div>
    </section>

    <section class="tile talks" id="talks">
      <div class="tile-h"><h2>近日のトーク・イベント</h2><span class="count">3週間以内</span></div>
      <div class="t-alert" id="t-alert"></div>
      <div class="seg tf" role="group" aria-label="申込で絞り込み"><button data-tf="all">すべて</button><button data-tf="free">申込不要</button><button data-tf="req">要申込</button></div>
      <div id="trows"></div>
    </section>

    <section class="tile chart" id="chart">
      <div class="tile-h"><h2>会期チャート</h2>
        <div class="seg" role="group" aria-label="並び順"><button data-sort="end">閉幕順</button><button data-sort="start">開幕順</button><button data-sort="genre">ジャンル</button></div>
      </div>
      <div class="tl-box"><div class="tl" id="tl"></div></div>
      <div class="legend-g" id="tl-legend"></div>
      <div class="legend"><span><i style="background:var(--muted)"></i>開催中</span><span><i style="background:var(--muted);box-shadow:0 0 0 2px var(--white),0 0 0 4px var(--peach)"></i>2週間以内に終了</span><span><i style="background:repeating-linear-gradient(115deg,var(--muted) 0 3px,transparent 3px 6px);box-shadow:inset 0 0 0 1.5px var(--muted)"></i>開幕前</span></div>
    </section>

  </div>

  <footer><span>情報源</span><ul id="sources"></ul><p id="updated"></p></footer>
</div>

<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div></div>

<script>
const GENRES={con:{l:"現代アート",c:"--g-con",k:"現"},pho:{l:"写真・映像",c:"--g-pho",k:"写"},jpn:{l:"日本美術・工芸",c:"--g-jpn",k:"和"},wst:{l:"西洋美術",c:"--g-wst",k:"洋"},
  des:{l:"デザイン・建築",c:"--g-des",k:"デ"},tec:{l:"メディアアート・科学",c:"--g-tec",k:"技"},ill:{l:"イラスト・絵本",c:"--g-ill",k:"絵"},pop:{l:"アニメ・漫画・ゲーム",c:"--g-pop",k:"漫"},mus:{l:"音楽・サウンド",c:"--g-mus",k:"音"},oth:{l:"その他",c:"--g-oth",k:"他"}};
const GORDER=Object.keys(GENRES), OLD_GENRE={cls:"wst",med:"tec",ani:"pop"};
const SCALE={museum:"美術館・博物館",space:"大型展示施設",gallery:"ギャラリー・小規模館"};
const AREAS=["東京","神奈川","千葉","埼玉","茨城","栃木","群馬"], WD="日月火水木金土", DAY=864e5;
const ARROW='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12 12 4M6 4h6v6"/></svg>';
let DATA={},EX=[],PICKS=[],TODAY,R0,R1,SPAN;
const state={genre:"all",area:"all",st:"all",scale:"all",q:"",sort:"end",all:false};const SHOW=8;

const D=s=>s?new Date(s+"T00:00:00+09:00"):null;
const days=(a,b)=>Math.round((b-a)/DAY);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const md=s=>{if(!s)return"?";const d=D(s);return`${d.getMonth()+1}/${d.getDate()}`;};
const wd=s=>s?WD[D(s).getDay()]:"";
const full=s=>{if(!s)return null;const d=D(s);return`${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}（${WD[d.getDay()]}）`;};
const byId=id=>EX.find(e=>e.id===id);
const tint=g=>`background:linear-gradient(150deg,color-mix(in srgb,var(${GENRES[g].c}) 38%,var(--white)),color-mix(in srgb,var(${GENRES[g].c}) 10%,var(--white)))`;
const endD=x=>x.e?D(x.e):new Date(+R1+365*DAY);
function status(x){
  if(!x.e){ if(x.permanent){const s=D(x.s);return(s&&TODAY<s)?{k:"soon",n:days(TODAY,s)}:{k:"perm"};} return{k:"tbd"}; }
  const s=D(x.s),e=D(x.e);
  if(s&&TODAY<s) return{k:"soon",n:days(TODAY,s)};
  if(TODAY>e) return{k:"past"};
  const n=days(TODAY,e); return{k:n<=14?"ending":"open",n};
}
const ST_LABEL={ending:"まもなく終了",open:"開催中",soon:"近日開幕",perm:"常設",tbd:"会期要確認"};
const remain=x=>{const s=status(x);return s.k==="soon"?`${s.n}日後`:s.k==="ending"||s.k==="open"?(s.n===0?"今日まで":`${s.n}日`):"—";};
const period=x=>x.permanent&&!x.e?(x.s?`${md(x.s)}〜 常設`:"常設"):`${md(x.s)} – ${md(x.e)}`;
const upcoming=x=>(x.events||[]).filter(e=>e.d&&D(e.d)>=TODAY).sort((a,b)=>D(a.d)-D(b.d));
const alive=()=>EX.filter(x=>status(x).k!=="past");

let favs=new Set();
try{favs=new Set(JSON.parse(localStorage.getItem("artdays-favs")||"[]"));}catch(e){}
try{const s=localStorage.getItem("artdays-sort");if(["end","start","genre"].includes(s))state.sort=s;}catch(e){}
const saveFavs=()=>{try{localStorage.setItem("artdays-favs",JSON.stringify([...favs]));}catch(e){}};

/* ---------- hero + KPIs ---------- */
function drawTop(){
  document.getElementById("today-d").textContent=`${TODAY.getMonth()+1}.${String(TODAY.getDate()).padStart(2,"0")}`;
  document.getElementById("today-w").textContent=`${TODAY.getFullYear()}年 ${WD[TODAY.getDay()]}曜日${DATA.updatedAt?` ・ ${md(DATA.updatedAt)} 更新`:""}`;
  document.getElementById("notice").textContent=DATA.notice||"";
  const live=alive().filter(x=>status(x).k!=="soon"), ending=EX.filter(x=>status(x).k==="ending");
  const share=live.length?Math.max(6,ending.length/live.length*100):0;
  document.getElementById("stats").innerHTML=
    `<div class="stat"><span>開催中の展示</span><b class="num">${live.length}<small>件</small></b></div>
     <div class="stat"><span>うち2週間以内に終了</span><b class="num">${ending.length}<small>件</small></b></div>
     <div class="bars"><i class="b1"></i><div class="b2wrap"><i class="b2" style="width:${share}%"></i></div></div>`;

  const kpi=(el,title,list,n,dayOf,unit)=>{
    const cnt=Array.from({length:n},(_,i)=>list.filter(x=>dayOf(x)===i).length);
    const mx=Math.max(1,...cnt);
    const code=cnt.map((c,i)=>`<i class="${c?"on":""}" style="height:${c?40+60*c/mx:18+(i*37%11)*1.3}%"></i>`).join("");
    el.innerHTML=`<div class="tile-h"><h2>${title}</h2><a class="go" href="#list" data-st="${el.id==="k-closing"?"ending":"soon"}" aria-label="${title}を一覧で見る">${ARROW}</a></div>
      <div class="big"><div class="v"><b class="num">${list.length}</b><span>${unit}</span></div><div class="code" aria-hidden="true">${code}</div></div>
      <div class="sub">${list.slice(0,3).map(x=>`<button data-id="${esc(x.id)}"><span>${esc(x.t)}</span><span>${el.id==="k-closing"?md(x.e):md(x.s)}</span></button>`).join("")||"該当なし"}</div>`;
  };
  const closing=EX.filter(x=>status(x).k==="ending").sort((a,b)=>D(a.e)-D(b.e));
  const opening=EX.filter(x=>{const s=status(x);return s.k==="soon"&&s.n<=61;}).sort((a,b)=>D(a.s)-D(b.s));
  kpi(document.getElementById("k-closing"),"まもなく終了",closing,15,x=>status(x).n,"件 ・ 14日以内に閉幕");
  kpi(document.getElementById("k-opening"),"近日開幕",opening,31,x=>Math.floor(status(x).n/2),"件 ・ 2か月以内に開幕");

  document.getElementById("pcards").innerHTML=PICKS.map(p=>{
    const x=byId(p.id), s=status(x);
    return `<article class="pc" data-id="${esc(x.id)}" tabindex="0" role="button" aria-label="${esc(x.t)}">
      <div class="vis" style="${tint(x.g)}"><span class="kanji" aria-hidden="true">${GENRES[x.g].k}</span>
        <div class="acts"><button class="go star-btn" data-fav="${esc(x.id)}" aria-pressed="${favs.has(x.id)}" aria-label="行きたい">${favs.has(x.id)?"★":"☆"}</button><span class="go dark">${ARROW}</span></div>
        <div class="chips"><span class="chip">${ST_LABEL[s.k]}</span><span class="chip">${esc(GENRES[x.g].l)}</span></div></div>
      <div class="info"><div class="r1"><h3>${esc(x.t)}</h3><span class="end">${x.e?`〜${md(x.e)}`:"常設"}</span></div>
        <span class="where">${esc(x.v)}・${esc(x.city)}</span></div>
      <p class="why">${esc(p.why)}</p>
      <div class="tags"><span>${esc(x.pref)}</span><span>${esc(x.price?x.price.split(/[／\/、]/)[0]:"料金要確認")}</span><span>${esc(x.booking||"予約要確認")}</span></div>
    </article>`;}).join("");

  drawTalks();

  document.getElementById("sources").innerHTML=(DATA.sources||[]).map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a></li>`).join("");
  document.getElementById("updated").textContent=`${DATA.updatedAt||"?"} 時点のWeb検索結果から作成。会期・料金・予約は各館の公式サイトで確認してください。`;
}

/* ---------- filters ---------- */
function base(skip){
  return alive().filter(x=>
    (skip==="genre"||state.genre==="all"||x.g===state.genre)&&
    (skip==="area"||state.area==="all"||x.pref===state.area)&&
    (skip==="st"||state.st==="all"||(state.st==="fav"?favs.has(x.id):status(x).k===state.st))&&
    (skip==="scale"||state.scale==="all"||(x.scale||"museum")===state.scale)&&
    (!state.q||(x.t+x.v+x.city).toLowerCase().includes(state.q.toLowerCase())));
}
function drawFilters(){
  const opt=(arr,cur)=>arr.map(([v,l])=>`<option value="${v}"${v===cur?" selected":""}>${l}</option>`).join("");
  document.getElementById("f-genre").innerHTML=opt([["all","ジャンル：すべて"],...GORDER.map(k=>[k,GENRES[k].l])],state.genre);
  document.getElementById("f-area").innerHTML=opt([["all","エリア：すべて"],...AREAS.map(a=>[a,a])],state.area);
  document.getElementById("f-status").innerHTML=opt([["all","状態：すべて"],["ending","まもなく終了"],["open","開催中"],["soon","近日開幕"],["perm","常設"],["fav","★ 行きたい"]],state.st);

  document.getElementById("f-scale").innerHTML=opt([["all","会場：すべて"],...Object.entries(SCALE)],state.scale);
  const gl=base("genre"), mx=Math.max(1,...GORDER.map(g=>gl.filter(x=>x.g===g).length));
  document.getElementById("g-total").textContent=`${gl.length}件`;
  document.getElementById("gbars").innerHTML=GORDER.map(g=>{const n=gl.filter(x=>x.g===g).length;
    return `<button class="gb" data-genre="${g}" aria-pressed="${state.genre===g}"><span class="lbl">${GENRES[g].l}</span>
      <span class="track"><span class="fill" style="width:${n/mx*78}%"></span><span class="pill">${n}件</span></span></button>`;}).join("");

  drawMap();
}

/* ---------- table ---------- */
function drawRows(){
  const order={ending:0,open:1,perm:2,tbd:3,soon:4};
  const list=base().sort((a,b)=>{const sa=status(a),sb=status(b);return(order[sa.k]-order[sb.k])||((sa.n??999)-(sb.n??999));});
  document.getElementById("count").textContent=`${list.length}件を表示`;
  const more=document.getElementById("more");more.hidden=list.length<=SHOW;more.textContent=state.all?"たたむ":`残り${list.length-SHOW}件をすべて表示`;
  document.getElementById("rows").innerHTML=list.length?(state.all?list:list.slice(0,SHOW)).map(x=>{const s=status(x);
    return `<div class="tr" data-id="${esc(x.id)}" tabindex="0" role="button" aria-label="${esc(x.t)}">
      <span class="pn"><span class="thumb" style="${tint(x.g)}">${GENRES[x.g].k}</span><span><b>${esc(x.t)}</b><small>${esc(x.v)}・${esc(x.city)}</small></span></span>
      <span class="tc c-g">${esc(GENRES[x.g].l)}<br><small style="color:var(--muted)">${SCALE[x.scale]||""}</small></span>
      <span class="tc num c-d">${period(x)}</span>

const PR=KANTO.proj, prj=(lat,lon)=>[(lon-PR.lon0)*PR.c*PR.k,(PR.lat0-lat)*PR.k];
const VIEWS={kanto:{c:[36.05,139.75],w:3.0},all:{c:[35.62,139.68],w:1.5},center:{c:[35.672,139.755],w:.17}};
const PCHIP={埼玉:[36.02,139.35],東京:[35.70,139.33],千葉:[35.50,140.20],神奈川:[35.40,139.25],茨城:[36.33,140.25],栃木:[36.68,139.80],群馬:[36.48,138.95]};
const LANDMARKS=[["上野",35.7139,139.7745],["銀座",35.6717,139.7650],["丸の内",35.6812,139.7671],["六本木",35.6627,139.7312],["渋谷",35.6580,139.7016],["新宿",35.6896,139.7006],["虎ノ門",35.6668,139.7497],["豊洲",35.6551,139.7963],["天王洲",35.6228,139.7505],["お台場",35.6276,139.7766],["池袋",35.7295,139.7109]];
let mapView="all", vb=null, selVenue=null, anim=0, goal=null;
const DEG=PR.c*PR.k, WMIN=.006*DEG, WMAX=3.4*DEG, CLOSE=.45*DEG;
const gmap=v=>"https://www.google.com/maps/dir/?api=1&travelmode=transit&destination="+encodeURIComponent(v.v.replace(/（[^）]*）/g,"")+" "+(v.city||""));
try{const v=localStorage.getItem("artdays-mapview");if(VIEWS[v])mapView=v;}catch(_){}
function targetVB(view){const el=document.getElementById("map"),r=el.clientHeight/Math.max(1,el.clientWidth)||.82;
  const v=VIEWS[view],[cx,cy]=prj(v.c[0],v.c[1]),w=v.w*PR.c*PR.k;return[cx-w/2,cy-w*r/2,w,w*r];}
function venues(){
  const list=base("area"),by=new Map();
  list.forEach(x=>{if(!x.geo)return;const k=x.v;if(!by.has(k))by.set(k,{v:k,geo:x.geo,pref:x.pref,city:x.city,items:[]});by.get(k).items.push(x);});
  return [...by.values()];
}
function placeOverlay(){
  const ov=document.getElementById("map-ov"),[x0,y0,w,hh]=vb;
  ov.querySelectorAll("[data-lat]").forEach(n=>{const [x,y]=prj(+n.dataset.lat,+n.dataset.lon);n.style.left=((x-x0)/w*100)+"%";n.style.top=((y-y0)/hh*100)+"%";});
  document.getElementById("map-svg").setAttribute("viewBox",vb.join(" "));
}
function drawMap(){
  const svg=document.getElementById("map-svg");
  if(!svg.dataset.ready){
    svg.innerHTML=Object.entries(KANTO.paths).map(([k,d])=>k.startsWith("ctx:")?`<path class="ctx" vector-effect="non-scaling-stroke" d="${d}"/>`:`<path class="pf" data-area="${k}" vector-effect="non-scaling-stroke" d="${d}"/>`).join("");
    svg.dataset.ready=1;
  }
  svg.querySelectorAll(".pf").forEach(p=>{p.classList.toggle("on",state.area===p.dataset.area);p.classList.toggle("dim",state.area!=="all"&&state.area!==p.dataset.area);});
  if(!vb)vb=targetVB(mapView);
  const al=base("area"), vs=venues(), center=(goal||vb)[2]<CLOSE;
  const chips=center?LANDMARKS.map(([n,la,lo])=>`<span class="lm" data-lat="${la}" data-lon="${lo}">${n}</span>`).join("")
    :AREAS.map(a=>`<button class="pchip" data-area="${a}" aria-pressed="${state.area===a}" data-lat="${PCHIP[a][0]}" data-lon="${PCHIP[a][1]}">${a}<b>${al.filter(x=>x.pref===a).length}</b></button>`).join("");
  const pins=vs.sort((a,b)=>b.geo[0]-a.geo[0]).map(v=>{const n=v.items.length,gs=new Set(v.items.map(x=>x.g)),sz=Math.round((center?14:10)+4*Math.sqrt(n-1));
    const off=state.area!=="all"&&v.pref!==state.area;
    return `<button class="pin${gs.size>1?" multi":""}${off?" off":""}" data-venue="${esc(v.v)}" aria-pressed="${selVenue===v.v}" aria-label="${esc(v.v)}（${n}件）" data-lat="${v.geo[0]}" data-lon="${v.geo[1]}" style="width:${sz}px;height:${sz}px;--pc:var(${GENRES[v.items[0].g].c})"></button>`;}).join("");
  document.getElementById("map-ov").innerHTML=chips+pins;
  const nopin=al.filter(x=>!x.geo).length;
  document.getElementById("map-note").textContent=`${vs.length}会場・${al.length-nopin}件をピン表示${nopin?`（複数会場や位置が未確認の${nopin}件は地図に出ません）`:""}。ピンの色はジャンル（白黒のピンは複数ジャンルの会場）。地図は二本指でつまむか＋－で拡大、横になぞって移動できます。`;
  markView();

}
function drawVenue(){
  const el=document.getElementById("venue"), v=selVenue&&venues().find(v=>v.v===selVenue);

  el.innerHTML=`<h3>${esc(v.v)}</h3>`+v.items.map(x=>`<button data-id="${esc(x.id)}"><i style="background:var(${GENRES[x.g].c})"></i><span>${esc(x.t)}</span><span>${x.e?`〜${md(x.e)}`:"常設"}</span></button>`).join("")+`<a class="route" href="${esc(gmap(v))}" target="_blank" rel="noopener">Googleマップで経路を見る ${ARROW.replace("<svg","<svg width=12 height=12")}</a>`;
}
function setView(view){
  mapView=view;try{localStorage.setItem("artdays-mapview",view);}catch(_){}
  animateTo(targetVB(view));
}
function animateTo(to){
  const from=vb.slice(),t0=performance.now(),dur=matchMedia("(prefers-reduced-motion: reduce)").matches?0:400;

  const step=t=>{const k=dur?Math.min(1,(t-t0)/dur):1,e=1-Math.pow(1-k,3);vb=from.map((f,i)=>f+(to[i]-f)*e);placeOverlay();if(k<1)anim=requestAnimationFrame(step);else goal=null;};

}
/* zoom around a point given in viewBox units; f>1 zooms in */
function zoomed(b,mx,my,f){const w=Math.min(WMAX,Math.max(WMIN,b[2]/f)),k=w/b[2];return[mx-(mx-b[0])*k,my-(my-b[1])*k,w,b[3]*k];}
function zoomBtn(dir){const [x,y,w,hh]=vb;mapView=null;markView();animateTo(clampVB(zoomed(vb,x+w/2,y+hh/2,dir==="in"?2:.5)));}
function clampVB(b){const [x0,y0]=prj(37.3,138.3),[x1,y1]=prj(34.8,141.0);
  const cx=Math.min(x1,Math.max(x0,b[0]+b[2]/2)),cy=Math.min(y1,Math.max(y0,b[1]+b[3]/2));return[cx-b[2]/2,cy-b[3]/2,b[2],b[3]];}
function markView(){document.querySelectorAll("[data-view]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.view===mapView));}
addEventListener("resize",()=>{if(!vb)return;if(mapView){vb=targetVB(mapView);}else{const el=document.getElementById("map"),r=el.clientHeight/Math.max(1,el.clientWidth)||.82,cy=vb[1]+vb[3]/2;vb=[vb[0],cy-vb[2]*r/2,vb[2],vb[2]*r];}placeOverlay();});
(function mapGestures(){
  const el=document.getElementById("map"),pts=new Map();let g=null,moved=false,raf=0;
  const rect=()=>el.getBoundingClientRect();
  const begin=()=>{const r=rect(),p=[...pts.values()];cancelAnimationFrame(anim);goal=null;
    if(p.length>=2){const mx=(p[0].x+p[1].x)/2,my=(p[0].y+p[1].y)/2;
      g={two:true,b:vb.slice(),d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)||1,ax:vb[0]+(mx-r.left)/r.width*vb[2],ay:vb[1]+(my-r.top)/r.height*vb[3]};}
    else if(p.length===1)g={two:false,b:vb.slice(),x:p[0].x,y:p[0].y};else g=null;};
  const paint=()=>{raf=0;placeOverlay();};
  el.addEventListener("pointerdown",e=>{if(e.button>0||e.target.closest(".zoom"))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===1)moved=false;begin();});
  el.addEventListener("pointermove",e=>{if(!pts.has(e.pointerId)||!g)return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const r=rect(),p=[...pts.values()];
    if(g.two&&p.length>=2){const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),mx=(p[0].x+p[1].x)/2,my=(p[0].y+p[1].y)/2;
      const w=Math.min(WMAX,Math.max(WMIN,g.b[2]*g.d/d)),hh=g.b[3]*w/g.b[2];
      vb=[g.ax-(mx-r.left)/r.width*w,g.ay-(my-r.top)/r.height*hh,w,hh];moved=true;}
    else if(!g.two){const dx=e.clientX-g.x,dy=e.clientY-g.y;if(!moved&&Math.hypot(dx,dy)<6)return;
      if(!moved){moved=true;el.classList.add("dragging");try{el.setPointerCapture(e.pointerId);}catch(_){}}
      vb=[g.b[0]-dx/r.width*g.b[2],g.b[1]-dy/r.height*g.b[3],g.b[2],g.b[3]];}
    else return;
    vb=clampVB(vb);if(mapView){mapView=null;markView();}
    if(!raf)raf=requestAnimationFrame(paint);});
  const end=e=>{if(!pts.delete(e.pointerId))return;el.classList.remove("dragging");
    if(pts.size)begin();else{g=null;if(moved){cancelAnimationFrame(raf);raf=0;drawMap();}}};
  ["pointerup","pointercancel","lostpointercapture"].forEach(t=>el.addEventListener(t,end));
  el.addEventListener("click",e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false;}},true);
  el.addEventListener("wheel",e=>{if(!e.ctrlKey)return;e.preventDefault();const r=rect();
    const mx=vb[0]+(e.clientX-r.left)/r.width*vb[2],my=vb[1]+(e.clientY-r.top)/r.height*vb[3];
    vb=clampVB(zoomed(vb,mx,my,Math.exp(-e.deltaY/100)));if(mapView){mapView=null;markView();}placeOverlay();
    clearTimeout(el._wt);el._wt=setTimeout(drawMap,150);},{passive:false});
  ["gesturestart","gesturechange"].forEach(t=>el.addEventListener(t,e=>e.preventDefault()));
})();

/* ---------- sheet ---------- */
const scrim=document.getElementById("scrim"),sheet=document.getElementById("sheet");let lastFocus=null;

/* ---------- talks: booking status ---------- */
const talkState={f:"all",closed:false};
function applyState(e){
  const dl=e.deadline&&days(TODAY,D(e.deadline)), op=e.opens&&days(TODAY,D(e.opens));
  if(e.apply==="closed"||(e.apply==="required"&&e.deadline&&dl<0))return{k:"closed",l:"受付終了"};
  if(e.apply==="required"&&e.opens&&op>0)return{k:"soon",l:op===1?"明日 受付開始":`${md(e.opens)} 受付開始`,n:op};
  if(e.apply==="required")return e.deadline?{k:dl<=3?"req hot":"req",l:dl===0?"今日 申込締切":`要申込・${md(e.deadline)}締切`,n:dl}:{k:"req",l:"要申込（締切は要確認）"};
  if(e.apply==="none")return{k:"free",l:"申込不要"};
  return{k:"tbd",l:"申込要確認"};
}
const apChip=e=>{const a=applyState(e);return`<span class="ap ${a.k}">${a.l}</span>`;};
function drawTalks(){
  const limit=new Date(+TODAY+21*DAY);
  const all=EX.flatMap(x=>upcoming(x).map(e=>({x,e,a:applyState(e)})));
  // deadlines and openings coming up, even for events further ahead
  const soon=all.filter(({a})=>(a.k.startsWith("req")&&a.n!=null&&a.n<=7)||(a.k==="soon"&&a.n<=7))
    .sort((p,q)=>p.a.n-q.a.n);
  document.getElementById("t-alert").innerHTML=soon.length?`<p class="al-h">申込の締切・受付開始が近いもの</p>`+soon.map(({x,e,a})=>
    `<button class="al" data-id="${esc(x.id)}"><span class="ap ${a.k}">${a.k==="soon"?(a.n===1?"明日 受付開始":`${a.n}日後 受付開始`):(a.n===0?"今日 締切":`あと${a.n}日で締切`)}</span>
      <span class="t">${esc(e.title)}</span><span class="m">${md(e.d)}（${wd(e.d)}）開催・${esc(x.v)}</span></button>`).join(""):"";
  let rows=all.filter(({e})=>D(e.d)<=limit);
  const nClosed=rows.filter(r=>r.a.k==="closed").length;
  if(!talkState.closed)rows=rows.filter(r=>r.a.k!=="closed");
  if(talkState.f==="free")rows=rows.filter(r=>r.a.k==="free");
  if(talkState.f==="req")rows=rows.filter(r=>r.a.k.startsWith("req")||r.a.k==="soon");
  rows.sort((p,q)=>D(p.e.d)-D(q.e.d));
  document.querySelectorAll("[data-tf]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.tf===talkState.f));
  document.getElementById("trows").innerHTML=(rows.length?rows.slice(0,10).map(({x,e})=>`<div class="trow${applyState(e).k==="closed"?" off":""}" data-id="${esc(x.id)}" role="button" tabindex="0">
      <span class="dbox"><b>${md(e.d)}</b><small>${wd(e.d)}${e.time?` ${esc(e.time.split(/[–-]/)[0])}`:""}</small></span>
      <span class="what"><span class="kr"><span class="k">${esc(e.kind||"イベント")}</span>${apChip(e)}</span><span class="t">${esc(e.title)}</span><span class="m">${esc(x.t)}</span></span></div>`).join("")
    :`<p class="empty">${talkState.f==="free"?"3週間以内に申込不要のイベントは見つかっていません":talkState.f==="req"?"3週間以内に申込が必要なイベントは見つかっていません":"3週間以内の関連イベントは見つかっていません"}</p>`)
    +(rows.length>10?`<p class="count">ほか${rows.length-10}件</p>`:"")
    +(nClosed?`<button class="morebtn" data-tclosed>${talkState.closed?"受付終了を隠す":`受付終了の${nClosed}件も表示`}</button>`:"");
}
function evHTML(e,past){
  const m=[e.time,e.place].filter(Boolean).map(esc).join("　"), m2=[e.booking,e.price].filter(Boolean).map(esc).join("・");
  return `<div class="ev${past?" past":""}"><span class="dbox"><b>${md(e.d)}</b><small>${wd(e.d)}曜</small></span>
    <span class="what"><span class="kr"><span class="k">${esc(e.kind||"イベント")}</span>${past?"":apChip(e)}</span><span class="t">${esc(e.title)}</span>
    ${e.who?`<span class="m">登壇：${esc(e.who)}</span>`:""}${m?`<span class="m">${m}</span>`:""}
    <span class="m">${m2||'<span class="tbd">申込方法・料金は要確認</span>'}</span>
    ${e.url&&!past?`<a href="${esc(e.url)}" target="_blank" rel="noopener">詳細を見る</a>`:""}</span></div>`;
}
function openSheet(id){
  const x=byId(id);if(!x)return;if(scrim.hidden)lastFocus=document.activeElement;
  const s=status(x), tbd=v=>v?esc(v):'<span class="tbd">要確認</span>';

    :!up.length?`<p class="ev-empty">今後の関連イベントは公式サイトに載っていません${x.eventsCheckedAt?`（${md(x.eventsCheckedAt)} 確認）`:""}。</p>`
    :up.map(e=>evHTML(e,false)).join("");
  if(past.length) ev+=`<details><summary>終了したイベント ${past.length}件</summary><div class="evs">${past.map(e=>evHTML(e,true)).join("")}</div></details>`;
  const per=x.permanent&&!x.e?`${x.s?full(x.s)+" から":""}常設`:`${full(x.s)||'<span class="tbd">要確認</span>'} – ${full(x.e)||'<span class="tbd">要確認</span>'}`;
  sheet.innerHTML=`<span class="grab" aria-hidden="true"></span>
    <div class="vis" style="${tint(x.g)}"><span class="kanji" aria-hidden="true">${GENRES[x.g].k}</span>
      <div class="acts"><button class="go" id="sheet-close" aria-label="閉じる"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m4 4 8 8M12 4l-8 8"/></svg></button></div>
      <div class="chips"><span class="chip">${ST_LABEL[s.k]}${s.n!=null?`・${remain(x)}`:""}</span><span class="chip">${esc(GENRES[x.g].l)}</span></div></div>
    <div style="display:grid;gap:6px"><h3 id="sheet-title">${esc(x.t)}</h3><p class="one">${esc(x.one)}</p></div>
    <div class="facts">
      <div class="fact wide"><span>会期</span><b class="num" style="font-weight:400">${per}</b></div>
      <div class="fact wide"><span>会場${x.scale?`・${SCALE[x.scale]}`:""}</span><b>${esc(x.v)}（${esc(x.pref)}・${esc(x.city)}）</b></div>
      <div class="fact"><span>料金</span><b>${tbd(x.price)}</b></div>
      <div class="fact"><span>予約</span><b>${tbd(x.booking)}</b></div>
    </div>
    <div class="evs"><h4>関連イベント</h4>${ev}</div>
    <div class="btns">${x.url?`<a class="btn dark" href="${esc(x.url)}" target="_blank" rel="noopener">${x.official?"公式サイト":"情報源（公式は要確認）"} ${ARROW.replace("<svg","<svg width=14 height=14")}</a>`:""}
      ${x.geo?`<a class="btn" href="${esc(gmap({v:x.v,city:x.city}))}" target="_blank" rel="noopener">経路（Googleマップ）</a>`:""}<button class="btn" id="sheet-fav">${favs.has(x.id)?"★ 行きたいから外す":"☆ 行きたい"}</button></div>`;
  scrim.hidden=false;document.documentElement.style.overflow="hidden";
  document.getElementById("sheet-close").onclick=closeSheet;
  document.getElementById("sheet-fav").onclick=()=>{toggleFav(x.id);openSheet(x.id);};
  sheet.scrollTop=0;document.getElementById("sheet-close").focus({preventScroll:true});
}

const b64u=s=>{const p="=".repeat((4-s.length%4)%4),r=atob((s+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from(r,c=>c.charCodeAt(0));};
